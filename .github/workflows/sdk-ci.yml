name: SDK CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third-party-executors/package-lock.json

      - name: Install root and third-party package dependencies
        run: |
          npm ci
          npm --prefix third-party-executors ci

      - name: Lint, typecheck, and run tests across SDK packages
        run: npm run check:all

      - name: Build and dry-pack both packages
        run: |
          npm run pack:check
          npm --prefix third-party-executors run pack:check

      - name: Pack both SDK tarballs
        run: |
          set -e
          mkdir -p artifacts
          TARBALL="$(npm pack --pack-destination artifacts | tail -n 1)"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          ADAPTER_TARBALL="$(npm pack ./third-party-executors --pack-destination artifacts | tail -n 1)"
          echo "ADAPTER_TARBALL=$ADAPTER_TARBALL" >> "$GITHUB_ENV"

      - name: Install and smoke test both packed SDK tarballs
        run: |
          set -e
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/artifacts/$TARBALL" "$GITHUB_WORKSPACE/artifacts/$ADAPTER_TARBALL" >/dev/null 2>&1
          npm pkg set type=module
          cp -R "$GITHUB_WORKSPACE/examples/typescript" ./examples
          cp -R "$GITHUB_WORKSPACE/third-party-executors/examples/typescript" ./adapter-examples
          node --input-type=module -e "const sdk = await import('@402flow/sdk'); if (!sdk.AgentPayClient || !sdk.createAgentPayClient || !sdk.createJsonRequestBody) { throw new Error('Packed artifact missing expected root exports.'); }"
          node --input-type=module <<'NODE'
          const root = await import('@402flow/sdk-third-party-executors');
          const dexter = await import('@402flow/sdk-third-party-executors/dexter');
          const paySh = await import('@402flow/sdk-third-party-executors/pay-sh');
          for (const factory of [root.createDexterExecutor, root.createPayShExecutor, dexter.createDexterExecutor, paySh.createPayShExecutor]) {
            if (typeof factory !== 'function') throw new Error('Packed adapter missing an expected export.');
          }
          NODE
          for TS_VERSION in 5.8.2 5.9.3; do
            npm install --save-dev --ignore-scripts "typescript@$TS_VERSION" @types/node@20 >/dev/null 2>&1
            ./node_modules/.bin/tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --types node examples/*.ts adapter-examples/*.ts
          done

      - name: Upload packed SDK tarballs
        if: ${{ matrix.node-version == 22 }}
        uses: actions/upload-artifact@v4
        with:
          name: sdk-package
          path: artifacts/*.tgz
  typescript-compatibility:
    name: TypeScript ${{ matrix.typescript-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript-version:
          - 5.8.2
          - 5.9.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            third-party-executors/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix third-party-executors ci
          npm install --no-save --package-lock=false typescript@${{ matrix.typescript-version }}

      - name: Type-check SDK, examples, and adapters
        run: |
          ./node_modules/.bin/tsc -p tsconfig.typecheck.json --noEmit
          ./node_modules/.bin/tsc -p third-party-executors/tsconfig.json --noEmit
